<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biplane Game — Lab 05 (Authoritative 30 Hz + Binary)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0b1120;
        color: #f8fafc;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      canvas {
        border: 2px solid #334155;
        border-radius: 10px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
        background: #0f172a;
        display: block;
      }
      #lobby-overlay {
        position: fixed;
        inset: 0;
        background: rgba(11, 17, 32, 0.88);
        backdrop-filter: blur(6px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 20;
      }
      #lobby-overlay.visible {
        display: flex;
      }
      .lobby-card {
        width: 100%;
        max-width: 660px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      }
      .lobby-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
      .lobby-title {
        font-size: 20px;
        font-weight: 700;
        color: #f8fafc;
      }
      .lobby-status {
        font-size: 12px;
        color: #38bdf8;
        font-family: monospace;
      }
      .lobby-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .lobby-input {
        background: #0f172a;
        border: 1px solid #475569;
        color: #f8fafc;
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 14px;
        flex: 1;
        min-width: 150px;
      }
      .btn {
        background: #0284c7;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 9px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn:hover {
        background: #0369a1;
      }
      .btn-secondary {
        background: #334155;
      }
      .btn-secondary:hover {
        background: #475569;
      }
      .room-list {
        display: grid;
        gap: 10px;
        max-height: 320px;
        overflow-y: auto;
      }
      .room-item {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 13px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .room-item:hover {
        border-color: #38bdf8;
      }
      .room-name {
        font-size: 15px;
        font-weight: 600;
        color: #f1f5f9;
      }
      .room-meta {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 4px;
      }
      .lobby-error {
        background: rgba(239, 68, 68, 0.16);
        border: 1px solid #ef4444;
        color: #fca5a5;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 12px;
        display: none;
      }
      .lobby-error.visible {
        display: block;
      }
      #net-controls {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 6px 12px;
        display: none;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        z-index: 10;
        flex-wrap: wrap;
      }
      #net-controls.visible {
        display: flex;
      }
      #net-controls label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: #cbd5e1;
        cursor: pointer;
      }
      #net-controls select,
      #net-controls input[type='range'] {
        accent-color: #38bdf8;
        background: #020617;
        color: #f8fafc;
        border: 1px solid #475569;
        border-radius: 4px;
        padding: 2px 4px;
        font-size: 11px;
      }
      #chat-panel {
        position: fixed;
        right: 16px;
        bottom: 16px;
        width: 290px;
        background: rgba(15, 23, 42, 0.86);
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 8px;
        display: none;
        flex-direction: column;
        gap: 6px;
        z-index: 5;
      }
      #chat-panel.visible {
        display: flex;
      }
      #chat-messages {
        max-height: 110px;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.4;
        color: #e2e8f0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .chat-sys {
        color: #38bdf8;
        font-style: italic;
      }
      .chat-form {
        display: flex;
        gap: 6px;
      }
      #chat-input {
        flex: 1;
        background: #020617;
        border: 1px solid #475569;
        border-radius: 6px;
        color: #f8fafc;
        padding: 5px 8px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="net-controls">
      <label title="Затримка сервера + розкид + втрата пакетів">
        NetSim:
        <select id="ctrl-netsim">
          <option value="0,0,0">0 ms (LAN)</option>
          <option value="100,0,0">100 ms</option>
          <option value="100,30,0.02">100 ± 30 ms, 2% drop</option>
          <option value="150,40,0.05">150 ± 40 ms, 5% drop</option>
        </select>
      </label>
      <label><input type="checkbox" id="ctrl-predict" checked /> Prediction</label>
      <label>
        Interp:
        <select id="ctrl-interp">
          <option value="0">0 ms</option>
          <option value="66">66 ms</option>
          <option value="100" selected>100 ms</option>
          <option value="150">150 ms</option>
        </select>
      </label>
      <label>
        Codec:
        <select id="ctrl-codec">
          <option value="binary" selected>Binary (DataView)</option>
          <option value="json">JSON</option>
        </select>
      </label>
      <label title="Навмисне ламання детермінізму через Math.random()">
        <input type="checkbox" id="ctrl-rand-bug" /> Math.random() bug
      </label>
    </div>

    <canvas id="game"></canvas>
    <div id="lobby-overlay"></div>
    <div id="chat-panel">
      <div id="chat-messages"></div>
      <form class="chat-form" id="chat-form">
        <input id="chat-input" type="text" maxlength="200" placeholder="Повідомлення у чат (Enter)..." />
        <button class="btn" type="submit" style="padding: 5px 10px; font-size: 12px;">OK</button>
      </form>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
