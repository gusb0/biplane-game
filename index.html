<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biplane Game — Lab 03</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0b1120;
        color: #f8fafc;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      canvas {
        border: 2px solid #334155;
        border-radius: 10px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
        background: #0f172a;
        display: block;
      }
      #lobby-overlay {
        position: fixed;
        inset: 0;
        background: rgba(11, 17, 32, 0.88);
        backdrop-filter: blur(6px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 10;
      }
      #lobby-overlay.visible {
        display: flex;
      }
      .lobby-card {
        width: 100%;
        max-width: 640px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      }
      .lobby-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
      .lobby-title {
        font-size: 22px;
        font-weight: 700;
        color: #f8fafc;
      }
      .lobby-status {
        font-size: 12px;
        color: #38bdf8;
        font-family: monospace;
      }
      .lobby-controls {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .lobby-input,
      .lobby-select {
        background: #0f172a;
        border: 1px solid #475569;
        color: #f8fafc;
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 14px;
      }
      .lobby-input {
        flex: 1;
        min-width: 180px;
      }
      .btn {
        background: #0284c7;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 9px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn:hover {
        background: #0369a1;
      }
      .btn-secondary {
        background: #334155;
      }
      .btn-secondary:hover {
        background: #475569;
      }
      .room-list {
        display: grid;
        gap: 10px;
        margin-bottom: 14px;
      }
      .room-item {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .room-item:hover {
        border-color: #38bdf8;
      }
      .room-name {
        font-size: 16px;
        font-weight: 600;
        color: #f1f5f9;
      }
      .room-meta {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 4px;
      }
      .lobby-error {
        background: rgba(239, 68, 68, 0.16);
        border: 1px solid #ef4444;
        color: #fca5a5;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 12px;
        display: none;
      }
      .lobby-error.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="lobby-overlay"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
